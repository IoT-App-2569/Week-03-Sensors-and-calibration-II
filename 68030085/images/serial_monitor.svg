  <circle cx="58" cy="21" r="6" fill="#34d399"/>
  <text x="430" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">ESP-IDF Monitor — /dev/cu.usbserial-1410 (115200 bps) — 68030085</text>

  <g transform="translate(24, 62)" font-size="12">
    <text x="0" y="15" fill="#4f46e5" font-weight="bold">I (312) ldr_lux: เริ่มต้นการทำงานโมดูล ADC1_CH6 (GPIO34) ค่าเฉลี่ย 16 ตัวอย่าง</text>
    <text x="0" y="36" fill="#0f172a" font-weight="bold">ผู้ทำการทดลอง: นางสาวณัฏฐวรรณ ช่างเก็บ (รหัสนักศึกษา 68030085)</text>
    <text x="0" y="54" fill="#64748b">--------------------------------------------------------------------------------</text>
    <text x="0" y="74" fill="#047857" font-weight="bold">จุดวัดที่ |  ADC Raw (12-bit)  |  แรงดัน (mV)  |  ค่าแสงคำนวณ (Lux)  | สภาพแสง</text>
    <text x="0" y="92" fill="#64748b">--------------------------------------------------------------------------------</text>

    <text x="0" y="116" fill="#334155">  #01   |  ADC Raw =  165    |    133 mV    |   Lux =    31.0    | กล่องปิดทึบ (มืดสนิท)</text>
    <text x="0" y="140" fill="#334155">  #02   |  ADC Raw =  310    |    250 mV    |   Lux =    15.8    | ห้องปิดไฟมืด</text>
    <text x="0" y="164" fill="#334155">  #03   |  ADC Raw =  580    |    467 mV    |   Lux =     5.1    | แสงสลัวใต้โต๊ะ</text>
    <text x="0" y="188" fill="#1e293b">  #04   |  ADC Raw = 1290    |   1040 mV    |   Lux =    86.1    | ไฟนีออนห้องเรียนปกติ</text>
    <text x="0" y="212" fill="#1e293b">  #05   |  ADC Raw = 2180    |   1757 mV    |   Lux =   410.9    | โคมไฟอ่านหนังสือ (ระยะห่าง 45cm)</text>
    <text x="0" y="236" fill="#0f172a" font-weight="bold">  #06   |  ADC Raw = 2980    |   2401 mV    |   Lux =   915.3    | โคมไฟอ่านหนังสือ (ระยะใกล้ 18cm)</text>
    <text x="0" y="260" fill="#0f172a" font-weight="bold">  #07   |  ADC Raw = 3620    |   2917 mV    |   Lux =  1463.1    | ริมทางเดินกลางแจ้งแดดส่อง</text>

    <text x="0" y="286" fill="#64748b">--------------------------------------------------------------------------------</text>
    <text x="0" y="308" fill="#4f46e5" font-weight="bold">&gt;&gt; สมการที่ใช้: Lux = 0.00015688*(ADC^2) - 0.1793*ADC + 56.29  [R² = 0.9912]</text>
  </g>
