<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title banner -->
  <rect x="0" y="0" width="850" height="50" fill="#1e293b" opacity="0.6"/>
  <text x="30" y="32" font-size="16" font-weight="bold" fill="#38bdf8">ESP32 &amp; LDR Voltage Divider Circuit Setup</text>
  <text x="820" y="32" text-anchor="end" font-size="13" fill="#94a3b8">Student: Supachok H. (68030282) | Lab 03</text>

  <!-- Breadboard Base -->
  <rect x="50" y="75" width="460" height="370" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="70" y="105" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="3">SOLDERLESS BREADBOARD</text>
  
  <!-- Rails (+ and -) -->
  <line x1="70" y1="120" x2="490" y2="120" stroke="#ef4444" stroke-width="2"/>
  <line x1="70" y1="130" x2="490" y2="130" stroke="#3b82f6" stroke-width="2"/>
  <line x1="70" y1="400" x2="490" y2="400" stroke="#ef4444" stroke-width="2"/>
  <line x1="70" y1="410" x2="490" y2="410" stroke="#3b82f6" stroke-width="2"/>

  <!-- ESP32 Module -->
  <g transform="translate(80, 160)">
    <rect width="170" height="210" rx="6" fill="#1e293b" stroke="#047857" stroke-width="2"/>
    <!-- ESP-WROOM-32 Shield -->
    <rect x="25" y="25" width="120" height="95" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <text x="85" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">ESP-WROOM-32</text>
    <text x="85" y="80" text-anchor="middle" font-size="8" fill="#334155">Wi-Fi &amp; BLE MCU</text>
    <!-- USB Port -->
    <rect x="65" y="195" width="40" height="18" rx="2" fill="#64748b"/>
    <!-- Pin Labels -->
    <text x="15" y="45" font-size="9" font-family="monospace" fill="#38bdf8">3V3</text>
    <circle cx="8" cy="42" r="3.5" fill="#e2e8f0"/>
    <text x="15" y="65" font-size="9" font-family="monospace" fill="#94a3b8">GND</text>
    <circle cx="8" cy="62" r="3.5" fill="#e2e8f0"/>
    <text x="130" y="45" font-size="9" font-family="monospace" fill="#4ade80">GPIO34</text>
    <circle cx="162" cy="42" r="3.5" fill="#e2e8f0"/>
  </g>

  <!-- LDR Component -->
  <g transform="translate(320, 180)">
    <circle cx="40" cy="40" r="28" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
    <!-- Wavy track -->
    <path d="M 22 30 Q 30 25 38 30 T 54 30 T 40 45 T 26 45 T 42 55" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <text x="40" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">LDR (CdS)</text>
    <line x1="25" y1="65" x2="25" y2="120" stroke="#64748b" stroke-width="2.5"/>
    <line x1="55" y1="65" x2="55" y2="120" stroke="#64748b" stroke-width="2.5"/>
  </g>

  <!-- Resistor 10k Component -->
  <g transform="translate(375, 300)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#64748b" stroke-width="2.5"/>
    <rect x="-8" y="20" width="16" height="45" rx="3" fill="#d97706"/>
    <!-- Color Bands (Brown, Black, Orange, Gold) -->
    <rect x="-8" y="26" width="16" height="4" fill="#78350f"/>
    <rect x="-8" y="34" width="16" height="4" fill="#000000"/>
    <rect x="-8" y="42" width="16" height="4" fill="#ea580c"/>
    <rect x="-8" y="54" width="16" height="3" fill="#fbbf24"/>
    <line x1="0" y1="65" x2="0" y2="85" stroke="#64748b" stroke-width="2.5"/>
    <text x="20" y="45" font-size="11" font-weight="bold" fill="#334155">R 10kΩ</text>
  </g>

  <!-- Wires -->
  <!-- 3.3V Wire (Red) -->
  <path d="M 88 202 C 60 202, 60 145, 345 145 L 345 245" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <text x="210" y="140" font-size="10" font-weight="bold" fill="#ef4444">3.3V Power</text>

  <!-- Node Signal Wire (Green) -> GPIO 34 -->
  <path d="M 242 202 C 290 202, 300 300, 375 300" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Connect LDR leg to Node -->
  <line x1="375" y1="245" x2="375" y2="300" stroke="#22c55e" stroke-width="3"/>
  <circle cx="375" cy="300" r="5" fill="#22c55e"/>
  <text x="270" y="270" font-size="10" font-weight="bold" fill="#22c55e">V_out -> GPIO 34</text>

  <!-- GND Wire (Black/Blue) -->
  <path d="M 88 222 C 60 222, 60 385, 375 385" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  <text x="220" y="380" font-size="10" font-weight="bold" fill="#3b82f6">GND Rail</text>

  <!-- Smartphone Ground Truth Instrument -->
  <g transform="translate(560, 95)">
    <!-- Phone Body -->
    <rect width="230" height="350" rx="26" fill="url(#phoneGrad)" stroke="#475569" stroke-width="4"/>
    <!-- Screen -->
    <rect x="14" y="24" width="202" height="302" rx="14" fill="#020617"/>
    <!-- Camera/Light Sensor Notch -->
    <rect x="75" y="32" width="80" height="14" rx="7" fill="#1e293b"/>
    <circle cx="95" cy="39" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="95" y="22" font-size="8" fill="#38bdf8" text-anchor="middle">Ambient Sensor</text>

    <!-- App UI -->
    <text x="115" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">LUX METER PRO</text>
    <text x="115" y="105" text-anchor="middle" font-size="9" fill="#64748b">Ground Truth Instrument</text>
    
    <!-- Big Lux Value Display -->
    <rect x="25" y="125" width="180" height="85" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="115" y="170" text-anchor="middle" font-size="34" font-weight="bold" fill="#38bdf8" filter="url(#glow)">460.0</text>
    <text x="115" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8">LUX (lx)</text>

    <!-- Mini chart bar inside app -->
    <rect x="35" y="235" width="160" height="12" rx="6" fill="#334155"/>
    <rect x="35" y="235" width="90" height="12" rx="6" fill="#38bdf8"/>
    <text x="115" y="268" text-anchor="middle" font-size="10" fill="#4ade80">● Status: Stable Signal</text>
    <text x="115" y="295" text-anchor="middle" font-size="9" fill="#64748b">Placed side-by-side with LDR</text>
  </g>
</svg>