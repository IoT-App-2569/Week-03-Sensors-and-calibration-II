<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <rect x="10" y="10" width="840" height="440" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="10" y="10" width="840" height="52" rx="14" fill="#4f46e5"/>
  <text x="35" y="42" font-size="16" font-weight="bold" fill="#ffffff">วงจรทดลอง LDR Voltage Divider ร่วมกับบอร์ด ESP32 (ADC1_CH6)</text>
  <text x="825" y="42" text-anchor="end" font-size="13" font-weight="500" fill="#e0e7ff">ผู้ทดลอง: น.ส.ณัฏฐวรรณ ช่างเก็บ (68030085)</text>

  <!-- Schematic Box Left -->
  <g transform="translate(35, 85)">
    <rect width="480" height="335" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="bold" fill="#1e293b">1. แผนผังการเชื่อมต่อฮาร์ดแวร์บนเบรดบอร์ด (GPIO 34)</text>

    <!-- ESP32 Board Visual -->
    <rect x="30" y="65" width="155" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="48" y="85" width="119" height="90" rx="4" fill="#cbd5e1"/>
    <text x="107" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">ESP32-WROOM</text>
    <text x="107" y="145" text-anchor="middle" font-size="9" fill="#475569">12-bit SAR ADC</text>
    <rect x="82" y="280" width="50" height="16" rx="3" fill="#94a3b8"/>

    <!-- Pins on ESP32 -->
    <circle cx="172" cy="110" r="4" fill="#ef4444"/>
    <text x="160" y="114" text-anchor="end" font-size="10" font-weight="bold" fill="#f87171">3.3V</text>

    <circle cx="172" cy="195" r="4" fill="#10b981"/>
    <text x="160" y="199" text-anchor="end" font-size="10" font-weight="bold" fill="#34d399">GPIO34</text>

    <circle cx="172" cy="255" r="4" fill="#3b82f6"/>
    <text x="160" y="259" text-anchor="end" font-size="10" font-weight="bold" fill="#60a5fa">GND</text>

    <!-- Voltage Divider Network -->
    <!-- 3.3V line -->
    <path d="M 176 110 L 340 110" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="255" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">ไฟเลี้ยง Vcc = 3.3V</text>

    <!-- LDR Symbol -->
    <circle cx="340" cy="150" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <polyline points="340,110 340,132 332,137 348,145 332,153 348,161 340,166 340,195" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <text x="375" y="150" font-size="11" font-weight="bold" fill="#92400e">LDR (CdS)</text>
    <text x="375" y="165" font-size="9.5" fill="#b45309">R เปลี่ยนตามแสง</text>

    <!-- Midpoint Node Vout -->
    <circle cx="340" cy="195" r="5" fill="#059669"/>
    <path d="M 176 195 L 340 195" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="258" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">V_out ส่งเข้า ADC1_CH6</text>

    <!-- R_fixed 10k Symbol -->
    <line x1="340" y1="195" x2="340" y2="212" stroke="#334155" stroke-width="2.5"/>
    <rect x="331" y="212" width="18" height="32" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <line x1="340" y1="244" x2="340" y2="255" stroke="#334155" stroke-width="2.5"/>
    <text x="375" y="232" font-size="11" font-weight="bold" fill="#1e293b">R คงที่ = 10 kΩ</text>

    <!-- GND line -->
    <path d="M 176 255 L 340 255" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="255" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">กราวด์ร่วม (System GND)</text>
  </g>

  <!-- Smartphone Lux Meter Right -->
  <g transform="translate(540, 85)">
    <rect width="285" height="335" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="20" y="28" font-size="13" font-weight="bold" fill="#1e293b">2. เครื่องมือวัดแสงอ้างอิง (มือถือ)</text>

    <rect x="52" y="48" width="180" height="268" rx="22" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="62" y="68" width="160" height="228" rx="10" fill="#ffffff"/>
    <circle cx="115" cy="58" r="3.5" fill="#38bdf8"/>
    <rect x="128" y="56" width="32" height="4" rx="2" fill="#475569"/>

    <rect x="62" y="68" width="160" height="32" fill="#059669"/>
    <text x="142" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">LIGHT METER APP</text>

    <circle cx="142" cy="155" r="46" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/>
    <text x="142" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#065f46">410</text>
    <text x="142" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">LUX (lx)</text>

    <text x="142" y="226" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">สภาวะ: โคมไฟตั้งโต๊ะ (ระยะกลาง)</text>
    <text x="142" y="244" text-anchor="middle" font-size="9.5" fill="#64748b">ADC อ่านได้: 2,180 (1.757 V)</text>
    <rect x="82" y="260" width="120" height="20" rx="5" fill="#e0e7ff"/>
    <text x="142" y="274" text-anchor="middle" font-size="9" font-weight="bold" fill="#4338ca">ID: 68030085 ณัฏฐวรรณ</text>
  </g>
</svg>