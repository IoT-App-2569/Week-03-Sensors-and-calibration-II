  <text x="520.0" y="600" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">ESP32 ADC Raw Value (12-bit: 0 - 4095, ADC1_CH6)</text>
  <text x="-312.5" y="35" transform="rotate(-90)" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Light Intensity (Lux) [Ground Truth Phone Lux Meter]</text>
