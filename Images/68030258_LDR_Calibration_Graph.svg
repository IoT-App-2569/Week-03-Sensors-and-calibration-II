    <text x="215.1" y="532.6" text-anchor="start">P2 (510, 28)</text>
    <text x="294.9" y="517.6" text-anchor="start">P3 (890, 85)</text>
    <text x="391.5" y="493.8" text-anchor="start">P4 (1350, 175)</text>
    <text x="517.5" y="458.2" text-anchor="start">P5 (1950, 310)</text>
    <text x="664.5" y="386.9" text-anchor="start">P6 (2650, 580)</text>
    <text x="814.5" y="236.5" text-anchor="end">P7 (3450, 1150)</text>
  </g>
  <!-- Legend Box -->
  <g filter="url(#shadow)">
    <rect x="125" y="90" width="420" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <text x="140" y="114" font-size="13" font-weight="bold" fill="#0f172a">แบบจำลองสมการเทียบมาตรฐาน (Calibration Models)</text>
  <circle cx="150" cy="138" r="5" fill="#f97316" stroke="#9a3412" stroke-width="1.5"/>
  <text x="165" y="142" font-size="11.5" fill="#334155">ข้อมูลที่วัดได้จริง 7 สภาพแสง (Measured Data Points)</text>
  <line x1="143" y1="168" x2="157" y2="168" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,4"/>
  <text x="165" y="165" font-size="11.5" font-weight="bold" fill="#dc2626">Linear Trendline:</text>
  <text x="265" y="165" font-size="11.5" fill="#1e293b">Lux = 0.3392 &#215; ADC + (-205.08)</text>
  <text x="265" y="182" font-size="11" font-weight="bold" fill="#b91c1c">R&#178; = 0.9120</text>
  <line x1="143" y1="208" x2="157" y2="208" stroke="#2563eb" stroke-width="2.5"/>
  <text x="165" y="206" font-size="11.5" font-weight="bold" fill="#2563eb">Polynomial (Degree 2):</text>
  <text x="165" y="222" font-size="11" fill="#1e293b">Lux = 0.0001162 &#215; ADC&#178; - 0.0884 &#215; ADC + 47.47</text>
  <text x="165" y="238" font-size="11" font-weight="bold" fill="#1d4ed8">R&#178; = 0.9946 (เหมาะสมสูงสุด: สอดคล้องกับพฤติกรรม LDR)</text>
