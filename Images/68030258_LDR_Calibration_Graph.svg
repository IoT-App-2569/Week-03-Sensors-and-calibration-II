    <line x1="310.0" y1="75" x2="310.0" y2="550"/>
    <line x1="415.0" y1="75" x2="415.0" y2="550"/>
    <line x1="520.0" y1="75" x2="520.0" y2="550"/>
    <line x1="625.0" y1="75" x2="625.0" y2="550"/>
    <line x1="730.0" y1="75" x2="730.0" y2="550"/>
    <line x1="835.0" y1="75" x2="835.0" y2="550"/>
    <line x1="940.0" y1="75" x2="940.0" y2="550"/>
  </g>
